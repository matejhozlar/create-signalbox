name: Publish to CurseForge

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read mod version
        id: mod
        run: |
          version=$(grep -E '^mod_version\s*=' gradle.properties | cut -d'=' -f2 | xargs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ steps.mod.outputs.version }}
          version-type: release
          name: "[${{ steps.mod.outputs.version }}] Create: Webhooks"
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          java: 21

          curseforge-id: 1484625
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
